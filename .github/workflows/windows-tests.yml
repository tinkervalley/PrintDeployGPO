name: Windows verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test deployment logic in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Run-Tests.ps1
      - name: Construct real Windows Forms controls
        if: always()
        shell: powershell
        run: .\tests\Run-GuiSmoke.ps1
